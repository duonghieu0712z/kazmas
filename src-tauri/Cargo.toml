[package]
name = "kazmas"
version = "0.0.1"
description = "The Kazmas App"
authors = ["duonghieu0712z"]
license = "Apache-2.0 OR MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kazmas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
desktop-tests = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "2.0.0-rc.25", features = ["chrono", "derive", "serde_json", "uuid"] }
specta-typescript = "0.0.12"
sqlx = { version = "0.9.0", features = ["chrono", "json", "sqlite", "uuid"] }
strum = { version = "0.28.0", features = ["derive"] }
tauri = { version = "2.11.6", features = ["devtools"] }
tauri-plugin-devtools = "2.2.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-log = "2.9.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-os = "2.3.2"
tauri-plugin-prevent-default = "6.0.0"
tauri-plugin-wdio = { version = "1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "sync", "time"] }
uuid = { version = "1.26.1", features = ["serde", "v7"] }
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["zstd"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.5"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "deny"
unused_imports = "warn"
unused_must_use = "deny"
unused_variables = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
used_underscore_binding = "allow"

await_holding_lock = "deny"
dbg_macro = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

clone_on_ref_ptr = "warn"
enum_glob_use = "warn"
expect_used = "warn"
inefficient_to_string = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
needless_collect = "warn"
redundant_clone = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
