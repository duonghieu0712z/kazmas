[package]
name = "macos-window-controls"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSButton", "NSView", "NSWindow"] }
tauri = { version = "2.11.6", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
