name: Quality Checks

on:
  workflow_call:

permissions:
  checks: write
  contents: read

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Check oxlint
        run: pnpm lint:check:oxlint --format=github

      - name: Check ESLint
        uses: reviewdog/action-eslint@v1
        with:
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-check' || 'github-check' }}
          filter_mode: ${{ github.event_name == 'pull_request' && 'added' || 'nofilter' }}
          fail_level: error
          eslint_flags: '. --cache'

      - name: Check types
        run: pnpm type-check

      - name: Build frontend
        run: pnpm build-only

  tauri-quality:
    name: Tauri quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          cache-workspaces: './src-tauri -> target'
          rustflags: ''

      - name: Setup nightly rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
          override: false
          cache: false
          rustflags: ''

      - name: Check formatting
        uses: actions-rust-lang/rustfmt@v1
        env:
          RUSTUP_TOOLCHAIN: nightly
        with:
          manifest-path: src-tauri/Cargo.toml

      - name: Check Clippy
        working-directory: src-tauri
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo clippy --all-targets --all-features -- -D warnings
