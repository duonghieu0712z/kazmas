name: Feature Request
description: Record a new feature to implement.
labels: ['feature']
body:
  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: What capability should be added?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What need or workflow would this address?
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe an implementation idea, if available.
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: Describe the scope and constraints.
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What observable results would make this complete?
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add references, screenshots, or related issues.
